# Build Proton Wine for Android (bionic), x86_64 + arm64ec.
#
# Single SDK 28 target with 16KB page size support; no separate SDK 35 build.
#
# Parts of this workflow (ccache caching, zstd .wcp packaging, profile.json
# generation, toolchain/termuxfs setup) are adopted from The412Banner/proton-wine
# (https://github.com/The412Banner/proton-wine, release build-p11-20260821).
name: Build Proton Wine (SDK 28, 16KB pages)

on:
  push:
    branches: [ proton_11.0-2 ]
  pull_request:
    branches: [ proton_11.0-2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            zstd \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Check out ntsync-android (userspace ntsync)
        uses: actions/checkout@v4
        with:
          repository: GameNative/ntsync-android
          path: ntsync-android

      - name: Set up Rust for ntsync-android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # ccache — caches compiled objects across runs (per-arch, rolling restore-keys).
      # Adopted from The412Banner/proton-wine. The build scripts wrap clang/clang++
      # in ccache automatically when it is on PATH.
      - name: Cache ccache (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-${{ matrix.arch }}-

      - name: Run autogen.sh for ${{ matrix.arch }}
        run: bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Build ntsync-android library for ${{ matrix.arch }}
        env:
          NTSYNC_ANDROID_DIR: ${{ github.workspace }}/ntsync-android
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-ntsync-android
          else
            bash build-scripts/build-step-arm64ec.sh --build-ntsync-android
          fi

      - name: Configure build for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --configure
          else
            bash build-scripts/build-step-arm64ec.sh --configure
          fi

      - name: Build Proton for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build
          else
            bash build-scripts/build-step-arm64ec.sh --build
          fi

      - name: ccache stats (${{ matrix.arch }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --install
          else
            bash build-scripts/build-step-arm64ec.sh --install
          fi

      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-x86_64-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          else
            wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          fi

      - name: Generate profile.json files
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi

          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "11.0-2-${ARCH_NAME}",
            "versionCode": 1,
            "description": "Proton 11.0-2 ${ARCH_NAME} (bionic) — stock Valve + userspace ntsync + fsync + Android fixes. SDK 28 + 16KB pages. Needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.0-2-${ARCH_NAME}",
            "versionCode": 0,
            "description": "Proton 11.0-2 ${ARCH_NAME} (bionic) — stock Valve + userspace ntsync + fsync + Android fixes. SDK 28 + 16KB pages. Needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi

          cd $OUTPUT_DIR

          # Create Proton WCP - zstd (tar.zst) for fast in-app install; adopted from
          # The412Banner/proton-wine. The app's ContentsManager tries XZ then falls back
          # to ZSTD, so a zstd .wcp installs with no app change and decompresses far
          # faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf proton-11.0-2-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv proton-11.0-2-$ARCH_NAME.wcp $GITHUB_WORKSPACE/

          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf proton-wine-11.0-2-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv proton-wine-11.0-2-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/

      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV

      - name: Upload Proton build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-${{ env.ARCH_NAME }}
          path: proton-11.0-2-${{ env.ARCH_NAME }}.wcp
          retention-days: 30

      - name: Upload Wine build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-${{ env.ARCH_NAME }}
          path: proton-wine-11.0-2-${{ env.ARCH_NAME }}.wcp.xz
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && github.ref == 'refs/heads/proton_11.0-2') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          find artifacts -name "*.wcp.xz" -exec cp {} release/ \;
          ls -lah release/

      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          TAG_NAME="proton-11.0-2-${DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Proton Wine 11.0-2 (${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Caution: This version is provided for testing purposes only. It may lead to game instability or crashes. Use at your own risk.

            ## Proton Wine Build based on Valve [Wine](https://github.com/ValveSoftware/wine/tree/proton_11.0)

            ### Proton Version: 11.0-2

            Built from commit: ${{ github.sha }}

            ### Architectures
            - x86_64 (Intel/AMD 64-bit)
            - arm64ec (ARM64EC)

            Single SDK 28 build with 16KB page size support (works on Android 9+ and Android 15+).

            ### Features
            - Experimental userspace ntsync (via [ntsync-android](https://github.com/GameNative/ntsync-android)) + fsync
            - FEX integration (stats shm, `SkipThreadAttach` detach guard) via bylaws' arm64ec patches
            - Integrated lsteamclient built into Proton (supports GameNative bionic Steam)
            - Stripped, `-g0 -O2` build: smaller tree, faster install (zstd-packed `.wcp`)

            ### Credits
            Compile optimizations (ccache, -g0/strip, zstd packaging) are adopted from [The412Banner/proton-wine](https://github.com/The412Banner/proton-wine) release [build-p11-20260821](https://github.com/The412Banner/proton-wine/releases/tag/build-p11-20260821).

            ### WCP Files
            **Proton Type:**
            - `proton-11.0-2-x86_64.wcp` - For GameNative
            - `proton-11.0-2-arm64ec.wcp` - For GameNative

            **Wine Type:**
            - `proton-wine-11.0-2-x86_64.wcp.xz` - For Winlator for CMOD & Ludashi
            - `proton-wine-11.0-2-arm64ec.wcp.xz` - For Winlator for CMOD & Ludashi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
